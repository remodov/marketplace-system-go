services:
  postgres-catalog-starter:
    image: postgres:16-alpine
    container_name: mpgo-postgres-catalog-starter
    restart: unless-stopped
    environment: { POSTGRES_USER: catalog, POSTGRES_PASSWORD: catalog, POSTGRES_DB: catalog_starter }
    ports: ["5440:5432"]
    volumes:
      - pg-catalog-starter:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog_starter"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: mpgo-redis
    restart: unless-stopped
    ports: ["6381:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pg-catalog-starter:
