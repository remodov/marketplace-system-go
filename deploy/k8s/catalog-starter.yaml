apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-starter
  labels:
    app: catalog-starter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-starter
  template:
    metadata:
      labels:
        app: catalog-starter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: app
          image: ghcr.io/remodov/catalog-starter-go:0.1.0
          ports:
            - containerPort: 8082
          env:
            - name: DATABASE_URL
              value: postgres://catalog:catalog@postgres-catalog-starter:5432/catalog_starter?sslmode=disable
            - name: REDIS_ADDR
              value: redis:6379
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8082
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-starter
spec:
  selector:
    app: catalog-starter
  ports:
    - port: 80
      targetPort: 8082
